<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: uma coluna de cartões (um por proporção), cada um com a animação ampliada e a cachorra passeando numa taskbar falsa. */
:root {
  --bg: #f1eee9;
  --surface: #fbfaf7;
  --ink: #1d1b1a;
  --muted: #6b645d;
  --line: #ddd6cc;
  --accent: #b5652f;      /* tan da Kiara */
  --bar-dark: #202020;    /* taskbar escura do Windows 11 */
  --bar-light: #f3f3f3;   /* taskbar clara */
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "Atkinson Hyperlegible", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161514; --surface: #1f1d1b; --ink: #f0ebe4; --muted: #a39a90; --line: #34302c; --accent: #d08a52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161514; --surface: #1f1d1b; --ink: #f0ebe4; --muted: #a39a90; --line: #34302c; --accent: #d08a52;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 20px; }
header h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 6vw, 40px); margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
header p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.controls label { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.controls input[type=range] { width: 140px; accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; padding: 6px 12px; background: transparent; color: var(--ink); border: 0; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button:focus-visible, .controls input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabular { font-variant-numeric: tabular-nums; }
.cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card h2 { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 0; display: flex; align-items: baseline; gap: 10px; }
.card h2 small { font-family: var(--font-body); font-size: 13px; color: var(--muted); font-weight: 400; }
.zoom { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.zoom figure { margin: 0; display: grid; gap: 4px; justify-items: center; }
.zoom figcaption { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; max-width: 100%; }
.zoom canvas { width: 100%; height: auto; border-radius: 8px; }
.bar { width: 100%; height: auto; border-radius: 6px; }
.foto { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.foto img { width: 100%; border-radius: 8px; }
.foto p { margin: 0; color: var(--muted); }
@media (max-width: 560px) { .foto { grid-template-columns: 1fr; } }
.mapa { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.mapa h2 { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 0; }
.mapa p { margin: 0; color: var(--muted); font-size: 14px; }
.mapa button { padding: 0; border: 1px solid var(--line); border-radius: 8px; background: #f3f3f3; cursor: zoom-in; overflow: hidden; }
.mapa button:focus-visible, .lb button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mapa img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.lb { position: fixed; inset: 0; z-index: 10; background: #f3f3f3; overflow: auto; overscroll-behavior: contain; }
.lb[hidden] { display: none; }
.lb img { display: block; max-width: none; image-rendering: pixelated; }
.lb .lb-bar { position: sticky; top: 0; left: 0; display: flex; gap: 8px; padding: 10px 16px; background: rgba(243, 243, 243, 0.92); }
.lb button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1px solid #cfc8bf; background: #fff; color: #1d1b1a; cursor: pointer; }
</style>

<div class="wrap">
  <header>
    <h1>__TITLE__</h1>
    <p>__INTRO__</p>
  </header>

  <div class="controls" role="group" aria-label="Controles da animação">
    <label for="speed">Velocidade <input id="speed" type="range" min="50" max="200" step="10" value="100"> <span id="speedv" class="tabular">100%</span></label>
    <span class="seg" role="group" aria-label="Taskbar">
      <button id="barLight" aria-pressed="true">Taskbar clara</button>
      <button id="barDark" aria-pressed="false">Taskbar escura</button>
    </span>
    <span class="seg" role="group" aria-label="Animação">
      <button id="play" aria-pressed="true">Animada</button>
      <button id="pause" aria-pressed="false">Parada</button>
    </span>
  </div>

  <div class="cards" id="cards"></div>

  <section class="mapa" aria-labelledby="mapaTitulo">
    <h2 id="mapaTitulo">Spritemap</h2>
    <p>Todos os frames numerados (f0, f1…), com a duração. A régua dá a coluna e a linha do pixel: toque pra ampliar e dê print no frame que quer mudar.</p>
    <button id="mapaBtn" aria-label="Ampliar o spritemap"><img id="mapa" alt="Spritemap com todos os frames das animações desta página, numerados e com grade de pixels"></button>
  </section>

  <div class="foto">
    <img id="foto" alt="Foto da Kiara de perfil, em pé ao lado do potinho de ração">
    <p>__FOTO_NOTA__</p>
  </div>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Spritemap ampliado">
  <div class="lb-bar">
    <button id="lbFechar">Fechar</button>
    <button id="lbTamanho" aria-pressed="false">Caber na tela</button>
  </div>
  <img id="lbImg" alt="Spritemap ampliado, em tamanho real">
</div>

<script>
const DATA = __DATA__;
const SCALE_ZOOM = 6, SCALE_BAR = 2, BAR_W = 420, BAR_H = 80;
let speed = 1, barTheme = 'light', playing = true;
// toca sempre: a página existe pra ver a animação (o botão "Parada" pausa)

function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }

const cards = document.getElementById('cards');
const views = [];

async function build() {
  document.getElementById('foto').src = DATA.foto;
  if (DATA.mapa) { document.getElementById('mapa').src = DATA.mapa; document.getElementById('lbImg').src = DATA.mapa; }
  else document.querySelector('.mapa').hidden = true;
  for (const v of DATA.variants) {
    const walk = await Promise.all(v.walk.map(load));
    const stand = await load(v.stand);
    const card = document.createElement('section');
    card.className = 'card';
    card.innerHTML = `<h2>${v.nome} <small>${v.nota}</small></h2>
      <div class="zoom">
        <figure><canvas width="${walk[0].width*SCALE_ZOOM}" height="${walk[0].height*SCALE_ZOOM}"></canvas><figcaption>animada</figcaption></figure>
        <figure><canvas width="${stand.width*SCALE_ZOOM}" height="${stand.height*SCALE_ZOOM}"></canvas><figcaption>parada</figcaption></figure>
      </div>
      <canvas class="bar" width="${BAR_W}" height="${BAR_H}" aria-label="Kiara passeando na taskbar"></canvas>`;
    cards.appendChild(card);
    const [cz, cs, cb] = card.querySelectorAll('canvas');
    views.push({ walk, stand, cz, cs, cb, x: v.step === 0 ? (BAR_W - walk[0].width*SCALE_BAR) / 2 : 10, dir: 1, durs: v.durs || [v.ms], step: v.step ?? 1, f: 0, last: 0 });
  }
  draw(); loop();
}

function ctxOf(c) { const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return x; }
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function draw() {
  const zoomBg = barTheme === 'dark' ? css('--bar-dark') : css('--bar-light');
  for (const v of views) {
    const img = v.walk[v.f % v.walk.length];
    let x = ctxOf(v.cz); x.fillStyle = zoomBg; x.fillRect(0, 0, v.cz.width, v.cz.height);
    x.drawImage(img, 0, 0, img.width*SCALE_ZOOM, img.height*SCALE_ZOOM);
    x = ctxOf(v.cs); x.fillStyle = zoomBg; x.fillRect(0, 0, v.cs.width, v.cs.height);
    x.drawImage(v.stand, 0, 0, v.stand.width*SCALE_ZOOM, v.stand.height*SCALE_ZOOM);
    x = ctxOf(v.cb); x.fillStyle = zoomBg; x.fillRect(0, 0, BAR_W, BAR_H);
    const sprite0 = playing ? img : v.stand;
    const w = sprite0.width*SCALE_BAR, h = sprite0.height*SCALE_BAR, y = BAR_H - h - 4;
    const sprite = sprite0;
    x.save();
    if (v.dir < 0) { x.translate(v.x + w, y); x.scale(-1, 1); x.drawImage(sprite, 0, 0, w, h); }
    else { x.drawImage(sprite, v.x, y, w, h); }
    x.restore();
  }
}

function step(v) {
  v.f = (v.f + 1) % v.walk.length;
  // patas plantadas recuam v.step px do sprite por frame: a janela anda o mesmo
  v.x += v.dir * v.step * SCALE_BAR;
  if (v.x > BAR_W - v.walk[0].width*SCALE_BAR - 6) v.dir = -1;
  if (v.x < 6) v.dir = 1;
}

function loop(t = 0) {
  if (playing) {
    let changed = false;
    for (const v of views) {
      if (t - v.last >= v.durs[v.f % v.durs.length] / speed) { step(v); v.last = t; changed = true; }
    }
    if (changed) draw();
  }
  requestAnimationFrame(loop);
}

document.getElementById('speed').addEventListener('input', e => {
  speed = +e.target.value / 100; document.getElementById('speedv').textContent = e.target.value + '%';
});
function setPressed(on, off) { on.setAttribute('aria-pressed', 'true'); off.setAttribute('aria-pressed', 'false'); }
const bd = document.getElementById('barDark'), bl = document.getElementById('barLight');
bd.onclick = () => { barTheme = 'dark'; setPressed(bd, bl); draw(); };
bl.onclick = () => { barTheme = 'light'; setPressed(bl, bd); draw(); };
const pl = document.getElementById('play'), pa = document.getElementById('pause');
pl.onclick = () => { playing = true; setPressed(pl, pa); };
pa.onclick = () => { playing = false; setPressed(pa, pl); draw(); };
// spritemap: abre em tela cheia no tamanho real (dá pra rolar e dar print); "Caber na tela" encolhe
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbT = document.getElementById('lbTamanho');
document.getElementById('mapaBtn').onclick = () => { lb.hidden = false; document.getElementById('lbFechar').focus(); };
document.getElementById('lbFechar').onclick = () => { lb.hidden = true; document.getElementById('mapaBtn').focus(); };
lbT.onclick = () => {
  const fit = lbT.getAttribute('aria-pressed') !== 'true';
  lbT.setAttribute('aria-pressed', String(fit));
  lbImg.style.width = fit ? '100%' : ''; lbT.textContent = fit ? 'Tamanho real' : 'Caber na tela';
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !lb.hidden) document.getElementById('lbFechar').click(); });
build();
</script>
